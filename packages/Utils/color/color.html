<!-- Palette de couleurs générée à partir des tokens -->

<!-- PRIMARY -->
<section class="color-section">
  <h3 class="pg-section-title">Primary</h3>
  <div class="color-group">
    <div class="color bg-primary p-4">
      <div class="color__content">
        <span class="color__name">primary</span>
        <span class="color__value" data-color="primary"></span>
      </div>
    </div>
    <div class="color bg-primary-light p-4">
      <div class="color__content">
        <span class="color__name">primary-light</span>
        <span class="color__value" data-color="primary-light"></span>
      </div>
    </div>
    <div class="color bg-primary-dark p-4">
      <div class="color__content">
        <span class="color__name">primary-dark</span>
        <span class="color__value" data-color="primary-dark"></span>
      </div>
    </div>
  </div>
</section>
