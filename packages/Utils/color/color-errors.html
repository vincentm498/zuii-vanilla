<!-- SUCCESS -->
<section class="color-section">
  <h3 class="pg-section-title">Success</h3>
  <div class="color-group">
    <div class="color bg-success p-4">
      <div class="color__content">
        <span class="color__name">success</span>
        <span class="color__value" data-color="success"></span>
      </div>
    </div>
    <div class="color bg-success-light p-4">
      <div class="color__content">
        <span class="color__name">success-light</span>
        <span class="color__value" data-color="success-light"></span>
      </div>
    </div>
    <div class="color bg-success-dark p-4">
      <div class="color__content">
        <span class="color__name">success-dark</span>
        <span class="color__value" data-color="success-dark"></span>
      </div>
    </div>
  </div>
</section>
