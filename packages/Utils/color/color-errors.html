<!-- SUCCESS -->
<section class="color-section">
  <h3 class="pg-section-title">Success</h3>
  <div class="color-group">
    <div class="color bg-success p-4">
      <div class="color__content">
        <span class="color__name">success (500)</span>
        <span class="color__value" data-color="success-500"></span>
      </div>
    </div>
    <div class="color bg-success-light p-4">
      <div class="color__content">
        <span class="color__name">success-light (100)</span>
        <span class="color__value" data-color="success-100"></span>
      </div>
    </div>
    <div class="color bg-success-dark p-4">
      <div class="color__content">
        <span class="color__name">success-dark (900)</span>
        <span class="color__value" data-color="success-900"></span>
      </div>
    </div>
  </div>
</section>
