<p>Utilisation de la classe <code>group</code> avec les modificateurs <code>--align-*</code> et
  <code>--justify-*</code> pour spécifier l'alignement et la justification des éléments du groupe.
</p>

<!-- Justify content -->
<div style="width: 100%; gap: var(--spacing-4); display: grid; grid-template-columns: repeat(2, 1fr);">
  <div>
    <label class="mb-1">Start <code>group--start</code></label>
    <div class="group group--start" style="width: 100%; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <div>
    <label class="mb-1">Center <code>group--center</code></label>
    <div class="group group--center" style="width: 100%; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <div>
    <label class="mb-1">End <code>group--end</code></label>
    <div class="group group--end" style="width: 100%; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <div>
    <label class="mb-1">Between <code>group--between</code></label>
    <div class="group group--between" style="width: 100%; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Combined alignment -->
  <div>
    <label class="mb-1">Top left <code>group--top-left</code></label>
    <div class="group group--top-left"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <div>
    <label class="mb-1">Center center <code>group--center-center</code></label>
    <div class="group group--center-center"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <div>
    <label class="mb-1">Bottom right <code>group--bottom-right</code></label>
    <div class="group group--bottom-right"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>
</div>
