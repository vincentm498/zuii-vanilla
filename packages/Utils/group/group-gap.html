<p>Utilisation de la classe <code>group</code> avec les modificateurs <code>--gap-none</code>,
  <code>--gap-xs</code>, <code>--gap-sm</code>, <code>--gap-md</code>, <code>--gap-lg</code> et <code>--gap-xl</code>
  pour spécifier l'espacement entre les éléments du groupe.
</p>
<div style="width: 100%; gap: var(--spacing-4); display: grid; grid-template-columns: repeat(2, 1fr);">

  <!-- Gap: none -->
  <div>
    <label class="mb-1">Gap none <code>group--gap-none</code></label>
    <div class="group group--gap-none"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Gap: xs -->
  <div>
    <label class="mb-1">Gap xs <code>group--gap-xs</code></label>
    <div class="group group--gap-xs"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Gap: sm -->
  <div>
    <label class="mb-1">Gap sm <code>group--gap-sm</code></label>
    <div class="group group--gap-sm"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Gap: md (default) -->
  <div>
    <label class="mb-1">Gap md <code>group--gap-md</code></label>
    <div class="group group--gap-md"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Gap: lg -->
  <div>
    <label class="mb-1">Gap lg <code>group--gap-lg</code></label>
    <div class="group group--gap-lg"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>

  <!-- Gap: xl -->
  <div>
    <label class="mb-1">Gap xl <code>group--gap-xl</code></label>
    <div class="group group--gap-xl"
      style="width: 200px; height: 100px; background: var(--neutral-100); padding: var(--spacing-4);">
      <button class="btn btn--primary">Btn</button>
      <button class="btn btn--secondary">Btn</button>
    </div>
  </div>
</div>
