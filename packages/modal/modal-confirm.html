<button class="btn btn--success" data-modal-target="#modal-confirm">Modal de Confirmation</button>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal--sm">
    <div class="modal__header">
      <h2 class="modal__title">Confirmer l'action</h2>
      <button class="modal__close" data-modal-close>✕</button>
    </div>
    <div class="modal__body">Êtes-vous sûr de vouloir continuer ? Cette action ne peut pas être annulée.</div>
    <div class="modal__footer">
      <button class="btn btn--ghost" data-modal-close>Annuler</button>
      <button class="btn btn--primary" data-modal-close>Confirmer</button>
    </div>
  </div>
</div>
