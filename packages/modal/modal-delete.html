<button class="btn btn--danger" data-modal-target="#modal-delete">Modal de Suppression</button>

<div class="modal-overlay" id="modal-delete">
  <div class="modal modal--sm">
    <div class="modal__header">
      <h2 class="modal__title" style="color:#dc2626">⚠ Supprimer l'élément</h2>
      <button class="modal__close" data-modal-close>✕</button>
    </div>
    <div class="modal__body">Cette action est <strong>irréversible</strong>. L'élément sera définitivement
      supprimé.</div>
    <div class="modal__footer">
      <button class="btn btn--ghost" data-modal-close>Annuler</button>
      <button class="btn btn--danger" data-modal-close>Supprimer</button>
    </div>
  </div>
</div>
