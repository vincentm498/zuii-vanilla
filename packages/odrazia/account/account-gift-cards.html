<div class="account-gift-cards" data-js-account-gift-cards>
  <div class="account-gift-cards__empty" data-js-gift-cards-empty>
    <p>Vous n'avez pas de carte cadeau</p>
  </div>

  <div class="account-gift-cards__table-wrapper" data-js-gift-cards-table style="display: none;">
    <table class="account-gift-cards__table">
      <thead>
        <tr>
          <th scope="col">Status</th>
          <th scope="col">Code</th>
          <th scope="col">Montant restant</th>
          <th scope="col">Date expiration</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody data-js-gift-cards-body></tbody>
    </table>
    <div class="account-gift-cards__pagination" data-js-gift-cards-pagination></div>
  </div>

  <template data-js-template-gift-card-row>
    <tr class="account-gift-cards__row" data-js-gift-card-row>
      <th scope="row" class="account-gift-cards__cell-status" data-js-gift-card-status></th>
      <td class="account-gift-cards__cell-code" data-js-gift-card-code></td>
      <td class="account-gift-cards__cell-amount" data-js-gift-card-amount></td>
      <td class="account-gift-cards__cell-expiry" data-js-gift-card-expiry></td>
      <td class="account-gift-cards__cell-actions">
        <a href="#" class="btn btn--sm btn--primary" data-js-gift-card-view>Voir</a>
      </td>
    </tr>
  </template>
</div>
