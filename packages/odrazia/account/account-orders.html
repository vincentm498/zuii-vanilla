<div class="account-orders" data-js-account-orders>
  <div class="account-orders__empty" data-js-orders-empty>
    <p>Vous n'avez pas encore effectué de commande</p>
  </div>

  <div class="account-orders__table-wrapper" data-js-orders-table style="display: none;">
    <table class="account-orders__table">
      <thead>
        <tr>
          <th scope="col">Référence</th>
          <th scope="col">Status</th>
          <th scope="col">Prix</th>
          <th scope="col">Date</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody data-js-orders-body></tbody>
    </table>
    <div class="account-orders__pagination" data-js-orders-pagination></div>
  </div>

  <template data-js-template-order-row>
    <tr class="account-orders__row" data-js-order-row>
      <th scope="row" class="account-orders__cell-ref" data-js-order-ref></th>
      <td class="account-orders__cell-status" data-js-order-status></td>
      <td class="account-orders__cell-total" data-js-order-total></td>
      <td class="account-orders__cell-date" data-js-order-date></td>
      <td class="account-orders__cell-actions">
        <a href="#" class="btn btn--icon btn--primary" data-js-order-view title="Voir">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <a href="#" class="btn btn--icon btn--secondary" data-js-order-invoice title="Facture">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </a>
      </td>
    </tr>
  </template>
</div>
