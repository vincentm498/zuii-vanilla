<div class="account-addresses" data-js-account-addresses>
  <div class="account-addresses__header">
    <button type="button" class="btn btn--primary btn--sm" data-js-address-add>Ajouter</button>
  </div>

  <div class="account-addresses__empty" data-js-addresses-empty>
    <p>Vous n'avez pas encore enregistré d'adresse</p>
  </div>

  <div class="account-addresses__table-wrapper" data-js-addresses-table style="display: none;">
    <table class="account-addresses__table">
      <thead>
        <tr>
          <th scope="col">Nom</th>
          <th scope="col">Adresse</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody data-js-addresses-body></tbody>
    </table>
    <div class="account-addresses__pagination" data-js-addresses-pagination></div>
  </div>

  <template data-js-template-address-row>
    <tr class="account-addresses__row" data-js-address-row>
      <th scope="row" class="account-addresses__cell-name" data-js-address-name></th>
      <td class="account-addresses__cell-address" data-js-address-full></td>
      <td class="account-addresses__cell-actions">
        <button type="button" class="btn btn--icon btn--primary" data-js-address-edit title="Modifier">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button type="button" class="btn btn--icon btn--danger" data-js-address-delete title="Supprimer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </td>
    </tr>
  </template>
</div>
