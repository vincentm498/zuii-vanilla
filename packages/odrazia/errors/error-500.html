<div class="error-page" data-js-error-page>
  <div class="error-page__container">
    <div class="error-page__visual">
      <div class="error-page__illustration" data-js-error-illustration>
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <circle cx="100" cy="100" r="80" stroke="var(--neutral-200, #e2e8f0)" stroke-width="2"/>
          <text x="100" y="120" text-anchor="middle" fill="var(--neutral-400, #94a3b8)" font-size="48" font-weight="var(--font-weight-bold, 700)">500</text>
          <path d="M90 145 L110 145" stroke="var(--danger-500, #f43f5e)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="error-page__content">
      <h1 class="error-page__title">Erreur serveur</h1>
      <p class="error-page__description">
        Une erreur inattendue s'est produite. Veuillez reessayer ulturieurement.
      </p>
      <div class="error-page__actions">
        <a href="javascript:location.reload()" class="btn btn--primary">
          Recharger la page
        </a>
        <a href="/" class="btn btn--secondary">
          Retour a l'accueil
        </a>
      </div>
    </div>
  </div>
</div>
