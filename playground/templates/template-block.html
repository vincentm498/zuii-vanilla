<div class="pg-demo-block">
  <div class="pg-demo-label">
    <span>{{displayLabel}}</span>
  </div>

  <div class="pg-demo-row" style="flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 20px;">
    {{content}}
  </div>

  <!-- Code Tabs Section -->
  <div class="pg-tabs-container is-collapsed" data-js-tabs-container>
    <div class="pg-tabs-header">
      <div class="pg-tabs-nav">
        <button class="pg-tab-btn is-active" data-tab="html">HTML</button>
        <button class="pg-tab-btn {{jsVisibleClass}}" data-tab="js">JavaScript</button>
      </div>
      
      <div class="pg-tabs-toggle-wrapper" data-js-tabs-toggle>
        <span data-js-toggle-text>Afficher le code source</span>
        <i data-lucide="chevron-up" class="pg-tabs-toggle-icon"></i>
      </div>
    </div>

    <div class="pg-tabs-body-wrapper">
      <div class="pg-tabs-content">
        <!-- HTML Tab -->
        <div class="pg-tab-pane is-active" id="html-{{id}}" data-tab-content="html">
          <div class="pg-demo-desc {{htmlDescVisibleClass}}" style="padding: 16px 20px 0;">
            {{htmlDescription}}
          </div>
          <div style="position: relative;">
            <button class="pg-code-copy-btn" data-clipboard="{{escapedContent}}">
              Copier
            </button>
            <pre class="pg-code"><code class="language-html">{{escapedContent}}</code></pre>
          </div>
        </div>

        <!-- JS Tab -->
        <div class="pg-tab-pane" id="js-{{id}}" data-tab-content="js">
          <div class="pg-demo-desc {{jsDescVisibleClass}}" style="padding: 16px 20px 0;">
            {{jsDescription}}
          </div>
          <div style="position: relative;">
            <button class="pg-code-copy-btn" data-clipboard="{{jsContent}}">
              Copier
            </button>
            <pre class="pg-code"><code class="language-javascript">{{jsContent}}</code></pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
