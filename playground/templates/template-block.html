<div class="pg-demo-block">
  <div class="pg-demo-label">
    <span>{{displayLabel}}</span>
  </div>

  <div class="pg-demo-row" style="flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 20px;">
    {{content}}
  </div>

  <div class="pg-demo-label {{codeVisibleClass}}">
    <span>Code à utiliser</span>
  </div>
  <div class="pg-demo-code-wrapper {{codeVisibleClass}}" style="position: relative;">
    <button class="btn btn--outline"
      style="position: absolute; top: 10px; right: 10px; padding: 4px 8px; font-size: 10px; cursor: pointer; z-index: 5; background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);"
      data-clipboard="{{escapedContent}}">
      Copier
    </button>
    <pre class="pg-code" style="margin: 0; padding-right: 80px;"><code class="language-html">{{escapedContent}}</code></pre>
  </div>
</div>
